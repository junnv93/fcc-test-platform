# mypy — 도메인 타입 규율 게이트 (설계서 §6.1 / S1)
#
# 왜 pyproject.toml 이 아닌 별도 파일인가:
#   루트 pyproject.toml 은 .extraction-layout.json 이 예약한 배송 경로다
#   (packaging/fcc-test-platform/pyproject.toml -> pyproject.toml). 배송이 관리하는
#   파일을 고치면 배송이 그 파일을 이름으로 대며 거부한다(README §배너). 게이트 설정을
#   여기 두면 배송 경계를 건드리지 않고, mypy 의 설정 우선순위상 mypy.ini 가
#   pyproject.toml 보다 앞서므로 나중에 배송본이 갱신돼도 게이트가 흔들리지 않는다.
#
# 범위 정책: 저장소 전체는 아직 strict 가 아니다. **아래 층만** 강제한다.
#
#   domain/*         — 순수(서드파티 의존 0, import-linter 계약 purity 가 KEPT 로
#                      지킨다)라 타입이 가장 잘 서고, 규율이 가장 싸다.
#   infrastructure/* — 2026-09-06 추가. 착수 전 층별 비용을 실측했다:
#                        domain 0 · infrastructure 20/3파일 ·
#                        application 189/36파일 · api 133/1파일
#                      infrastructure 가 압도적으로 싸고, 경계가 방금 세워진 층이라
#                      드리프트가 쌓이기 전이 가장 싼 시점이었다.
#
#   application.session/*   — 2026-09-06 추가. 이 하위 패키지는 strict 에서 **0건**이다
#   application.headless/*     (실측). 켜는 비용이 0 이고, 그 자리를 지키는 값은 크다 —
#                              둘 다 런타임 설정 로딩 경로이고, 거기서 새는 타입은
#                              프로세스 시작 시점에 화면까지 간다.
#
# ⚠️ **application 나머지는 아직이다.** 그 층 전체를 strict 로 켜면 145건(31파일)이
#    딸려 오고 전부 「선언 누락」이다 — 논리 결함은 이번 웨이브가 먼저 처분했다
#    (44건 → 0). 다음 웨이브는 그 145건만 자르면 되고, 자를 때 알아야 할 사실이 둘이다:
#
#      · 93건이 `central_*` 어댑터군에 있다(실측 2026-09-06).
#      · 그런데 **부분 와일드카드는 쓸 수 없다.** mypy 의 모듈 패턴에서 `*` 는 점으로
#        구분된 성분 «전체»만 대체한다. 실측:
#            [mypy-…application.central_*]                      → 0건 (매치 안 됨)
#            [mypy-…application.central_chamber_write_adapter]  → 12건 (동작)
#            [mypy-…application.*]                              → 145건
#        즉 「central_ 로 시작하는 어댑터군만」은 **표현할 수 없다.** 쪼개려면 모듈
#        이름을 하나씩 나열해야 하고, 그 목록은 아래 절과
#        `tests/test_architecture_gate_conformance.py::STRICT_SECTIONS` 두 곳이 아니라
#        **한 곳**(그 상수)에서 파생돼야 한다.
#
#   api/*            — 2026-09-06 추가. **마지막 층이고, 이것으로 `fcc_test_platform`
#                      전량이 strict 다.** 여기 있던 「아직 아니다」는 사유가 하나였다:
#                      133건이 `platform_routes.py` 단일 파일에 몰려 있어서, strict 를
#                      켜는 것이 곧 「그 파일을 분해할지」(설계서 §9)를 선점하는 것처럼
#                      보였다. **그 둘은 독립이다** — 이 웨이브는 파일을 분해하지 않고,
#                      contract-as-data 등록도 건드리지 않은 채 133 → 0 을 냈다.
#                      선언을 붙이는 것과 파일을 가르는 것은 다른 질문이었다.
#
# ── 범위 **밖**으로 남는 것 (여기 적지 않으면 다음 사람이 「전량 strict」로 읽는다)
#
#   tests/            — 검사 코드는 이 게이트의 대상이 아니다. `-p fcc_test_platform`
#                       아래에 있지도 않다.
#   apps/web/scripts/ — 파이썬이 아닌 표면의 보조 스크립트.
#
#   즉 「`fcc_test_platform` 전량 strict」이지 「저장소 전량 strict」가 아니다.

[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
disallow_untyped_defs = False

# 실행: MYPYPATH="." mypy -p fcc_test_platform.domain
[mypy-fcc_test_platform.domain.*]
disallow_untyped_defs = True

# 실행: MYPYPATH="." mypy -p fcc_test_platform.infrastructure
[mypy-fcc_test_platform.infrastructure.*]
disallow_untyped_defs = True



# ── application 나머지 전량 (2026-09-06) ─────────────────────────────────────
#
# **개별 24절이 여기서 와일드카드 하나로 접힌다.** 그 열거가 존재한 이유는 이름
# 규약이 아니라 «비용»이었다 — 층 전체를 켜면 145건이 딸려 왔으므로 감당 가능한
# 묶음씩 잘라 온 것이다. 이번 웨이브가 마지막 57건(서비스/스토어 14파일)을 처분해
# `application.*` 전량이 0건이 됐고, 그 순간 열거의 사유가 사라진다.
#
# ⚠️ 이 저장소가 여러 번 적은 *"부분 와일드카드(`central_*`)는 0건 매치"* 는 여전히
#    참이다. 바뀐 것은 그것이 아니라, **전체 와일드카드를 쓸 수 있게 됐다**는 것이다.
#    부분을 표현할 수 없어서 열거했는데, 이제 부분이 아니라 전부다.
#
# ⚠️ 그리고 이 형태가 «새 모듈»을 구성상 덮는다. 열거는 다음 파일이 조용히 빠지는
#    자리였다(그래서 `central_read_adapter` 가 두 웨이브 동안 밖에 있었다 — 이름이
#    `central_<X>_read_adapter` 규약을 안 따라 파생이 만들 수 없었다). 와일드카드는
#    그 구멍을 갖지 않는다.
#
# 이번 웨이브가 처분한 57건의 성격: **전부 `no-untyped-def`, 실제 타입 오류 0.**
# `#112` 가 그 층의 논리 결함 44건을 먼저 처분했기 때문이고, 그 순서가 옳았다.
[mypy-fcc_test_platform.application.*]
disallow_untyped_defs = True


# ── api — 마지막 층 (2026-09-06) ─────────────────────────────────────────────
#
# 실측 133건의 성격이 **둘**이었다: 순수 선언 부재 111 + 실제 타입 오류 22. 22를
# 먼저 처분해 남는 111 을 순수 선언 작업으로 만든 순서는 `application` 웨이브
# (44 → 145)와 같다.
#
# ⚠️ 이 층에서만 드러난 사실 셋 — 다음 사람이 되돌리지 않도록 적어 둔다.
#
#   · **선언은 층을 따라 전파된다.** `_require_*_service` 아홉의 반환을 선언하자 그
#     뒤의 서비스 호출이 `Any` 를 벗으면서 «없던» 실제 오류가 새로 드러났다. 즉
#     「111 은 순수 선언」이라는 첫 측정은 그 시점의 참이지 최종값이 아니었다.
#   · **`Mapping` 을 `dict` 라 부른 자리가 여덟이었고, `dict` 를 `list` 라 부른 자리가
#     하나였다**(`list_test_equipment_lists` — 주석까지 「Plain array」라고 적혀
#     있었는데 응답은 처음부터 객체였다).
#   · **측정 환경이 답을 바꾼다.** fastapi 없는 리그에서 21건이던 것이 CI 와 같은
#     설치(fastapi 있음)에서 60건이었다 — `Request` 가 `Any` 가 아니게 되면서
#     `_normalize_request_body_args` 의 파급이 비로소 보였다. 이 게이트를 재는
#     리그는 `pip install -e '.[test]'` 여야 한다.
[mypy-fcc_test_platform.api.*]
disallow_untyped_defs = True
























