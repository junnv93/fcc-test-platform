# mypy — 도메인 타입 규율 게이트 (설계서 §6.1 / S1)
#
# 왜 pyproject.toml 이 아닌 별도 파일인가:
#   루트 pyproject.toml 은 .extraction-layout.json 이 예약한 배송 경로다
#   (packaging/fcc-test-platform/pyproject.toml -> pyproject.toml). 배송이 관리하는
#   파일을 고치면 배송이 그 파일을 이름으로 대며 거부한다(README §배너). 게이트 설정을
#   여기 두면 배송 경계를 건드리지 않고, mypy 의 설정 우선순위상 mypy.ini 가
#   pyproject.toml 보다 앞서므로 나중에 배송본이 갱신돼도 게이트가 흔들리지 않는다.
#
# 범위 정책 — **오늘: `fcc_test_platform` 패키지 전량이 strict 다** (2026-09-07, `#159`).
#   그 «오늘»은 `[mypy]` 아래에서 한 번만 말한다. 여기는 **거기까지 온 경로의 기록**이다.
#
# ⚠️ 2026-09-07 정정. 이 줄은 *"저장소 전체는 아직 strict 가 아니다. **아래 층만**
#    강제한다"* 였고, 아래 블록이 「네 층 절이 한 절로 접혔다」를 적은 뒤에도 **현재형
#    그대로** 남아 한 파일이 여덟 줄 사이에서 자기 자신과 정면으로 모순했다.
#    고치는 사람은 «절 옆»을 고치므로, 두 곳에 적힌 정책은 언제나 **위쪽이** 낡는다.
#    그래서 위쪽은 시제를 과거로 못박는다 — 낡을 수 있는 문장을 두지 않는 것이 답이고,
#    「같이 고쳐라」라는 부탁은 답이 아니다.
#
#   domain/*         — 순수(서드파티 의존 0, import-linter 계약 purity 가 KEPT 로
#                      지킨다)라 타입이 가장 잘 서고, 규율이 가장 싸다.
#   infrastructure/* — 2026-09-06 추가. 착수 전 층별 비용을 실측했다:
#                        domain 0 · infrastructure 20/3파일 ·
#                        application 189/36파일 · api 133/1파일
#                      infrastructure 가 압도적으로 싸고, 경계가 방금 세워진 층이라
#                      드리프트가 쌓이기 전이 가장 싼 시점이었다.
#
#   application.session/*   — 2026-09-06 추가. 이 하위 패키지는 strict 에서 **0건**이다
#   application.headless/*     (실측). 켜는 비용이 0 이고, 그 자리를 지키는 값은 크다 —
#                              둘 다 런타임 설정 로딩 경로이고, 거기서 새는 타입은
#                              프로세스 시작 시점에 화면까지 간다.
#
# 🕘 **(그때) `application` 나머지는 아직이었다.** 그 층 전체를 strict 로 켜면 145건(31파일)이
#    딸려 오고 전부 「선언 누락」이다 — 논리 결함은 이번 웨이브가 먼저 처분했다
#    (44건 → 0). 다음 웨이브는 그 145건만 자르면 되고, 자를 때 알아야 할 사실이 둘이다:
#
#      · 93건이 `central_*` 어댑터군에 있다(실측 2026-09-06).
#      · 그런데 **부분 와일드카드는 쓸 수 없다.** mypy 의 모듈 패턴에서 `*` 는 점으로
#        구분된 성분 «전체»만 대체한다. 실측:
#            [mypy-…application.central_*]                      → 0건 (매치 안 됨)
#            [mypy-…application.central_chamber_write_adapter]  → 12건 (동작)
#            [mypy-…application.*]                              → 145건
#        즉 「central_ 로 시작하는 어댑터군만」은 **표현할 수 없다.** 쪼개려면 모듈
#        이름을 하나씩 나열해야 하고, 그 목록은 아래 절과
#        `tests/test_architecture_gate_conformance.py::STRICT_SECTIONS` 두 곳이 아니라
#        **한 곳**(그 상수)에서 파생돼야 한다.
#
#   api/*            — 2026-09-06 추가. **네 층의 마지막이다.** 여기 있던 「아직
#                      아니다」는 사유가 하나였다:
#                      133건이 `platform_routes.py` 단일 파일에 몰려 있어서, strict 를
#                      켜는 것이 곧 「그 파일을 분해할지」(설계서 §9)를 선점하는 것처럼
#                      보였다. **그 둘은 독립이다** — 이 웨이브는 파일을 분해하지 않고,
#                      contract-as-data 등록도 건드리지 않은 채 133 → 0 을 냈다.
#                      선언을 붙이는 것과 파일을 가르는 것은 다른 질문이었다.
#
# ── 🕘 **그때** 범위 **밖**이던 것 (오늘의 목록은 `[mypy]` 아래 같은 이름의 절에 있다)
#
#   fcc_test_platform/*.py (최상위 75 모듈)
#                     — ⚠️ **2026-09-07 정정.** 이 자리에 한때
#                       *"이것으로 `fcc_test_platform` 전량이 strict 다"* 라고 적혀
#                       있었다. **거짓이었다.** 위 네 절은 하위 패키지 넷만 덮고,
#                       최상위 모듈 75개는 어느 절과도 매치되지 않아
#                       `[mypy] disallow_untyped_defs = False` 만 걸린다.
#
#                       그 거짓말의 값이 정확히 측정됐다. 게이트는 절 이름에서 mypy
#                       호출 인자를 파생하므로 목록에 없는 그 75 모듈을 **호출조차
#                       하지 않았고**, 그 침묵 아래 실제 타입 오류 45건이 16파일에
#                       쌓였다(실측 2026-09-07, CI 와 같은 리그).
#
#                       ✅ **그 45건은 닫혔고, 게이트가 이제 그 자리를 «부른다»** —
#                       `tests/test_architecture_gate_conformance.py` 의
#                       `test_the_whole_package_is_type_checked` 가 `-p
#                       fcc_test_platform` 을 통째로 부른다. 단 그것은 **호출 축**이지
#                       **선언 축**이 아니다. 여기 절을 더하는 것과는 다른 일이다:
#
#                           호출만 넓힘 (mypy.ini 무변경)     45건 / 215파일 검사
#                           [mypy-fcc_test_platform.*] 추가  228건 / 215파일 검사
#                                                            = 위 45 + no-untyped-def 183
#
#                       ⚠️ 그리고 `fcc_test_platform.*` 패턴은 최상위를 **정말**
#                       매치한다. 이 파일이 위에서 적은 *"부분 와일드카드(`central_*`)는
#                       0건"* 과 **다른 축**이다 — 저것은 점으로 구분된 성분 «안»의
#                       부분 매치라 안 되고, 이것은 성분 «전체»라 된다.
#
#                       그 다음 웨이브(`#159`)가 처분한 것이 그 183건이고, 성격은
#                       전량 「선언 누락」이었다
#                       (실제 타입 오류는 이 웨이브가 45 → 0 으로 먼저 처분했다 —
#                       `application`·`api` 층이 밟은 것과 같은 순서다).
#
#   tests/            — 검사 코드는 이 게이트의 대상이 아니다. `-p fcc_test_platform`
#                       아래에 있지도 않다.
#   apps/web/scripts/ — 파이썬이 아닌 표면의 보조 스크립트.
#
#   즉 **그때** 참인 문장은 이것이었다: *"`fcc_test_platform` 전량이 «검사»되고, 그중
#   하위 패키지 넷이 «strict» 다 — 두 축이 아직 다르다."*
#
#   ✅ **오늘 두 축은 같다.** `[mypy-fcc_test_platform.*]`(아래)이 선언 축을 호출 축까지
#      넓혔다. 그리고 그것이 이 파일에서 가장 값나가는 결과다 — `disallow_untyped_defs`
#      가 패키지 전량에 걸리면서 **「선언 없는 def 라 mypy 가 본문을 통째로 건너뛴다」는
#      기제 자체가 불가능해졌다.** 그 기제가 `api/platform_routes._PrincipalResolver`
#      적합성을 검사 밖에 두고 있었고(2026-09-07 실측), 지금은 주입으로 red 가 난다.

[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
disallow_untyped_defs = False

# ── 범위: `fcc_test_platform` **패키지 전체** (2026-09-07) ───────────────────
#
# ⚠️ **네 층 절이 여기서 한 절로 접힌다. 그것이 이 변경의 요점이다.**
#
# 층 넷(`domain` · `infrastructure` · `application` · `api`)은 각각 0건이었다. 그런데
# **넷의 합집합이 패키지가 아니었다.** 게이트는 절 이름에서 호출 인자를 파생해 절마다
# «따로» 부르므로, `fcc_test_platform/` 바로 아래 놓인 모듈들은 어느 호출에서도
# source file 이 되지 못했다. 실측 2026-09-07(main@f143f2d, CI 와 같은 리그)::
#
#     4회 호출이 넘긴 것   51 + 11 + 75 + 2 = 139 source files
#     패키지 전체          215 source files
#
# 빨강도 초록도 아닌 **침묵**이었고, 그 침묵 아래 실제 타입 오류 45건(#158 이 처분)과
# 선언 부재 183건이 있었다. 이 절이 그 183건의 자리를 게이트 «안»으로 들인다.
#
# ⚠️ **왜 열거가 아니라 와일드카드인가.** 이 저장소는 같은 결정을 이미 한 번 했고
#    근거를 적어 두었다 — `application` 의 24모듈 열거를 접으면서, 열거가 «다음 파일이
#    조용히 빠지는 자리»임을 이름으로 기록했다(`central_read_adapter` 가 두 웨이브 동안
#    밖에 있었다). 층 열거도 같은 구멍이었고, 이번이 그 구멍이 실현된 사례다.
#    와일드카드는 그 구멍을 **구성상** 갖지 않는다 — 다음에 최상위에 놓이는 모듈은
#    태어나는 순간 게이트 안이다.
#
# ⚠️ *"부분 와일드카드(`central_*`)는 0건 매치"* 라는 실측은 **여전히 참이다.**
#    mypy 의 모듈 패턴에서 `*` 는 점으로 구분된 성분 «전체»만 대체한다. 즉
#    「최상위 모듈만」도 표현할 수 없다 — 표현할 수 있는 것은 «전부»뿐이고,
#    이제 전부를 선언한다.
#
# ⚠️ **이 절 하나가 옛 네 절을 정확히 포섭한다** — 실측: 이 절만 두고 잰 값이 전역
#    `--disallow-untyped-defs` 와 «같은 수»였다(228, 접기 전 시점). 그러므로 네 절을
#    남기는 것은 게이트가 mypy 를 5회 부르면서 뒤 4회가 새로 재는 것이 없다는 뜻이다.
#
# ── 층별 웨이브의 기록 (이 절이 접은 것)
#
#   domain          순수(서드파티 의존 0)라 타입이 가장 잘 서는 층. 처음부터 0건.
#   infrastructure  2026-09-06. 착수 시 20건/3파일 — 경계가 방금 세워져 가장 쌌다.
#   application     2026-09-06. 층 전체 145건. `#112` 가 논리 결함 44건을 «먼저»
#                   처분해 남는 145를 순수 선언 작업으로 만든 순서가 옳았다.
#   api             2026-09-06. 133건 = 순수 선언 111 + 실제 타입 오류 22.
#                   ⚠️ 그 웨이브가 남긴 사실: **선언은 층을 따라 전파된다.**
#                      `_require_*_service` 아홉의 반환을 선언하자 상류가 `Any` 를
#                      벗으며 «없던» 오류가 새로 드러났다.
#   최상위 모듈      2026-09-07. 183건 — 그리고 위 경고가 **또 참이었다**:
#                   `value: object` 를 붙이자 `int(value)`·`float(value)` 14건이,
#                   `connection: ScriptConnection` 을 붙이자 `fetchone()[0]` 31건이
#                   새로 드러났다. 즉 183은 하한이었고 실제로는 228을 처분했다.
#
# ── 범위 **밖**으로 남는 것 (여기 적지 않으면 다음 사람이 「저장소 전량」으로 읽는다)
#
#   tests/            검사 코드는 이 게이트의 대상이 아니다. `-p fcc_test_platform`
#                     아래에 있지도 않다. ⚠️ 2026-09-07 현재 **재지 않았다** —
#                     「적다」고도 「많다」고도 말하지 않는다.
#   scripts/          레인 도구. 같은 이유로 밖이다.
#   apps/web/scripts/ 파이썬이 아닌 표면의 보조 스크립트.
#
#   즉 「`fcc_test_platform` 전량 strict」이지 「저장소 전량 strict」가 아니다.
#   `[mypy] disallow_untyped_defs` 는 계속 `False` 이고, 게이트 봉인이 그것을 단언한다.
#
# 실행: MYPYPATH="." mypy -p fcc_test_platform
[mypy-fcc_test_platform.*]
disallow_untyped_defs = True
