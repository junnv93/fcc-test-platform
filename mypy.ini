# mypy — 도메인 타입 규율 게이트 (설계서 §6.1 / S1)
#
# 왜 pyproject.toml 이 아닌 별도 파일인가:
#   루트 pyproject.toml 은 .extraction-layout.json 이 예약한 배송 경로다
#   (packaging/fcc-test-platform/pyproject.toml -> pyproject.toml). 배송이 관리하는
#   파일을 고치면 배송이 그 파일을 이름으로 대며 거부한다(README §배너). 게이트 설정을
#   여기 두면 배송 경계를 건드리지 않고, mypy 의 설정 우선순위상 mypy.ini 가
#   pyproject.toml 보다 앞서므로 나중에 배송본이 갱신돼도 게이트가 흔들리지 않는다.
#
# 범위 정책: 저장소 전체는 아직 strict 가 아니다. **아래 층만** 강제한다.
#
#   domain/*         — 순수(서드파티 의존 0, import-linter 계약 purity 가 KEPT 로
#                      지킨다)라 타입이 가장 잘 서고, 규율이 가장 싸다.
#   infrastructure/* — 2026-09-06 추가. 착수 전 층별 비용을 실측했다:
#                        domain 0 · infrastructure 20/3파일 ·
#                        application 189/36파일 · api 133/1파일
#                      infrastructure 가 압도적으로 싸고, 경계가 방금 세워진 층이라
#                      드리프트가 쌓이기 전이 가장 싼 시점이었다.
#
# ⚠️ application/ 과 api/ 는 «아직» 아니다. api 의 133건은 platform_routes.py 단일
#    파일에 몰려 있고, 그 파일을 분해할지 조립 산출물로 둘지는 설계서 §9 의 미해결
#    질문이다 — 여기서 strict 를 켜면 그 판정을 선점하게 된다.

[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
disallow_untyped_defs = False

# 실행: MYPYPATH="." mypy -p fcc_test_platform.domain
[mypy-fcc_test_platform.domain.*]
disallow_untyped_defs = True

# 실행: MYPYPATH="." mypy -p fcc_test_platform.infrastructure
[mypy-fcc_test_platform.infrastructure.*]
disallow_untyped_defs = True
