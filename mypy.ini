# mypy — 도메인 타입 규율 게이트 (설계서 §6.1 / S1)
#
# 왜 pyproject.toml 이 아닌 별도 파일인가:
#   루트 pyproject.toml 은 .extraction-layout.json 이 예약한 배송 경로다
#   (packaging/fcc-test-platform/pyproject.toml -> pyproject.toml). 배송이 관리하는
#   파일을 고치면 배송이 그 파일을 이름으로 대며 거부한다(README §배너). 게이트 설정을
#   여기 두면 배송 경계를 건드리지 않고, mypy 의 설정 우선순위상 mypy.ini 가
#   pyproject.toml 보다 앞서므로 나중에 배송본이 갱신돼도 게이트가 흔들리지 않는다.
#
# 범위 정책: 저장소 전체는 아직 strict 가 아니다. **아래 층만** 강제한다.
#
#   domain/*         — 순수(서드파티 의존 0, import-linter 계약 purity 가 KEPT 로
#                      지킨다)라 타입이 가장 잘 서고, 규율이 가장 싸다.
#   infrastructure/* — 2026-09-06 추가. 착수 전 층별 비용을 실측했다:
#                        domain 0 · infrastructure 20/3파일 ·
#                        application 189/36파일 · api 133/1파일
#                      infrastructure 가 압도적으로 싸고, 경계가 방금 세워진 층이라
#                      드리프트가 쌓이기 전이 가장 싼 시점이었다.
#
#   application.session/*   — 2026-09-06 추가. 이 하위 패키지는 strict 에서 **0건**이다
#   application.headless/*     (실측). 켜는 비용이 0 이고, 그 자리를 지키는 값은 크다 —
#                              둘 다 런타임 설정 로딩 경로이고, 거기서 새는 타입은
#                              프로세스 시작 시점에 화면까지 간다.
#
# ⚠️ **application 나머지는 아직이다.** 그 층 전체를 strict 로 켜면 145건(31파일)이
#    딸려 오고 전부 「선언 누락」이다 — 논리 결함은 이번 웨이브가 먼저 처분했다
#    (44건 → 0). 다음 웨이브는 그 145건만 자르면 되고, 자를 때 알아야 할 사실이 둘이다:
#
#      · 93건이 `central_*` 어댑터군에 있다(실측 2026-09-06).
#      · 그런데 **부분 와일드카드는 쓸 수 없다.** mypy 의 모듈 패턴에서 `*` 는 점으로
#        구분된 성분 «전체»만 대체한다. 실측:
#            [mypy-…application.central_*]                      → 0건 (매치 안 됨)
#            [mypy-…application.central_chamber_write_adapter]  → 12건 (동작)
#            [mypy-…application.*]                              → 145건
#        즉 「central_ 로 시작하는 어댑터군만」은 **표현할 수 없다.** 쪼개려면 모듈
#        이름을 하나씩 나열해야 하고, 그 목록은 아래 절과
#        `tests/test_architecture_gate_conformance.py::STRICT_SECTIONS` 두 곳이 아니라
#        **한 곳**(그 상수)에서 파생돼야 한다.
#
# ⚠️ api/ 는 «아직» 아니다. 133건이 platform_routes.py 단일 파일에 몰려 있고, 그 파일을
#    분해할지 조립 산출물로 둘지는 설계서 §9 의 미해결 질문이다 — 여기서 strict 를 켜면
#    그 판정을 선점하게 된다.

[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
disallow_untyped_defs = False

# 실행: MYPYPATH="." mypy -p fcc_test_platform.domain
[mypy-fcc_test_platform.domain.*]
disallow_untyped_defs = True

# 실행: MYPYPATH="." mypy -p fcc_test_platform.infrastructure
[mypy-fcc_test_platform.infrastructure.*]
disallow_untyped_defs = True

# 실행: MYPYPATH="." mypy -p fcc_test_platform.application.session
[mypy-fcc_test_platform.application.session.*]
disallow_untyped_defs = True

# 실행: MYPYPATH="." mypy -p fcc_test_platform.application.headless
[mypy-fcc_test_platform.application.headless.*]
disallow_untyped_defs = True

# ── central_*_write_adapter 11모듈 (2026-09-06) ─────────────────────────────
#
# ⚠️ **패키지가 아니라 모듈을 하나씩 적는다.** 부분 와일드카드가 안 되기 때문이다 —
#    바로 위 주석이 그 실측을 담는다(`central_*` → 0건 매치). 이 열한 줄이 그
#    제약의 «가격»이고, 다음 묶음도 같은 값을 치른다.
#
# 왜 write 어댑터군이 먼저인가: 잔여 145건 중 최대 묶음(59건/11파일)이고 성격이
# 균일하며, write 경로가 감사 이벤트·트랜잭션 경계를 지므로 「포트가 거짓말을 할 때」
# 의 대가가 가장 크다.
#
# 실행: MYPYPATH="." mypy -m fcc_test_platform.application.central_<name>_write_adapter
[mypy-fcc_test_platform.application.central_chamber_write_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_sample_inventory_write_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_test_equipment_list_write_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_project_write_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_claim_write_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_artifact_custody_write_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_reference_write_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_membership_write_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_user_write_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_report_write_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_progress_write_adapter]
disallow_untyped_defs = True

# ── central_*_read_adapter 10모듈 (2026-09-06) ──────────────────────────────
#
# write 묶음과 «대칭»이다. 착수 전 층별 비용을 실측했고, 그 수는 **오류 코드로
# 나눠야** 재현된다(rig: MYPYPATH=REPO_ROOT, mypy 2.3.1):
#
#     no-untyped-def   13건 — artifact_custody 8 · sample_inventory 4 · catalog 1
#     attr-defined     12건 — 아래 ⚠️ 를 보라. **이 게이트는 그 12건을 못 본다.**
#
# 나머지 일곱(chamber · progress · project · rbac · reference · report ·
# test_equipment_list)은 선언 누락 0건이었다. 0건이어도 «켜는 것 자체»가 작업이다 —
# 켜 두지 않으면 그 모듈은 내일 선언 없는 함수를 조용히 받아들인다.
#
# ⚠️ **이 게이트가 볼 수 없는 축이 있다: 커널의 타입.** `fcc_test_kernel` 도
#    `fcc_test_contracts` 도 `py.typed` 를 싣지 않는다(실측 2026-09-06, 두 트리 전수
#    `find -name py.typed` → 0건). PEP 561 에 따라 mypy 는 그런 설치본의 타입을 «쓰지
#    않고», `ignore_missing_imports = True` 가 그것을 조용히 `Any` 로 만든다. 그래서
#    커널 포트(`DbCursor` · `DbConnection`)를 어긴 자리가 이 게이트에서는 초록이다.
#
#    rig 둘로 재서 갈랐다 — 같은 커밋 · 같은 mypy 2.3.1 · MYPYPATH 만 다르다:
#
#        MYPYPATH=REPO_ROOT                       → 13건  (= CI·pre-push 가 보는 것)
#        MYPYPATH=REPO_ROOT:형제트리:커널트리      → 25건  (+12 attr-defined)
#
#    ⚠️ 형제 트리의 `platform_database_port.py` 는 핀 태그 `kernel-v0.5.0` 과
#       **바이트 동일**임을 확인했다(git diff 공집합) — 미릴리스 변경이 딸려 온
#       것이 아니라 «핀된 표면»을 어기고 있었다.
#
#    이번 웨이브는 그 12건을 **전부 처분했다**(read 어댑터 10모듈이 커널
#    `DbCursor` 대신 이 레인의 `RowCursor`/`RowConnection` 을 받게 했다). 게이트
#    수치는 안 변한다 — 커널이 `py.typed` 를 얻는 날 값을 낸다.
#
#    남은 축: **write 어댑터 11모듈이 같은 rig 에서 50건이다**(reference 19 ·
#    artifact_custody 5 · project 4 · claim 4 · membership 4 · chamber 3 ·
#    test_equipment_list 3 · user 3 · report 3 · sample_inventory 1 · progress 1).
#    domain · infrastructure · session · headless 는 두 rig 모두 0건이다.
#
# 실행: MYPYPATH="." mypy -m fcc_test_platform.application.central_<name>_read_adapter
[mypy-fcc_test_platform.application.central_chamber_read_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_progress_read_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_progress_catalog_read_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_project_read_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_rbac_read_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_reference_read_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_report_read_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_test_equipment_list_read_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_artifact_custody_read_adapter]
disallow_untyped_defs = True

[mypy-fcc_test_platform.application.central_sample_inventory_read_adapter]
disallow_untyped_defs = True
