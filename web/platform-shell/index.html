<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FCC Test Platform Shell</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div>
            <h1>FCC Test Platform</h1>
            <p>Provider operations shell</p>
          </div>
        </div>

        <form id="provider-form" class="provider-form">
          <label for="provider-base-url">Provider API</label>
          <div class="inline-control">
            <input
              id="provider-base-url"
              name="provider-base-url"
              type="url"
              value="http://127.0.0.1:8000"
              spellcheck="false"
            >
            <button type="submit">Connect</button>
          </div>
        </form>

        <form id="auth-form" class="provider-form">
          <label for="bearer-token">Bearer Token</label>
          <div class="inline-control">
            <input
              id="bearer-token"
              name="bearer-token"
              type="password"
              autocomplete="off"
              spellcheck="false"
            >
            <button type="submit">Use</button>
          </div>
          <div class="inline-control auth-actions">
            <button id="oidc-sign-in" type="button" disabled>Sign in</button>
            <button id="oidc-sign-out" type="button">Sign out</button>
          </div>
        </form>

        <nav class="nav-tabs" aria-label="Platform views">
          <button class="nav-tab active" data-view="overview" type="button">Overview</button>
          <button class="nav-tab" data-view="jobs" type="button">Jobs</button>
          <button class="nav-tab" data-view="session" type="button">Session</button>
          <button class="nav-tab" data-view="reports" type="button">Reports</button>
        </nav>
      </aside>

      <main class="content">
        <section class="toolbar">
          <div>
            <p class="eyebrow">Current Provider</p>
            <h2 id="provider-title">Not connected</h2>
          </div>
          <div class="toolbar-actions">
            <button id="refresh-current" type="button">Refresh</button>
            <span id="connection-status" class="status-chip muted">Idle</span>
          </div>
        </section>

        <section id="overview" class="view active">
          <div class="metric-grid">
            <article class="metric">
              <span>Health</span>
              <strong id="health-value">-</strong>
            </article>
            <article class="metric">
              <span>Provider</span>
              <strong id="provider-value">-</strong>
            </article>
            <article class="metric">
              <span>Product Line</span>
              <strong id="product-line-value">-</strong>
            </article>
            <article class="metric">
              <span>Contract</span>
              <strong id="contract-value">-</strong>
            </article>
          </div>
          <div class="panel">
            <div class="panel-header">
              <h3>Capabilities</h3>
              <button id="load-capabilities" type="button">Load</button>
            </div>
            <pre id="capabilities-output" class="json-output">{}</pre>
          </div>
        </section>

        <section id="jobs" class="view">
          <div class="panel">
            <div class="panel-header">
              <h3>Measurement Jobs</h3>
              <div class="compact-controls">
                <input id="job-status-filter" type="text" placeholder="status">
                <button id="load-jobs" type="button">Load Jobs</button>
              </div>
            </div>
            <div id="jobs-table" class="data-table"></div>
          </div>
        </section>

        <section id="session" class="view">
          <div class="panel">
            <div class="panel-header">
              <h3>Session Browser</h3>
              <div class="compact-controls">
                <input id="session-id-input" type="number" min="1" placeholder="session id">
                <button id="load-session-results" type="button">Results</button>
                <button id="load-session-artifacts" type="button">Artifacts</button>
              </div>
            </div>
            <div id="session-table" class="data-table"></div>
          </div>
        </section>

        <section id="reports" class="view">
          <div class="panel">
            <div class="panel-header">
              <h3>Report Status</h3>
              <div class="compact-controls">
                <input id="report-request-id-input" type="number" min="1" placeholder="request id">
                <button id="load-report-request" type="button">Request</button>
                <button id="load-report-outputs" type="button">Outputs</button>
              </div>
            </div>
            <div id="report-output-summary" class="summary-strip" aria-live="polite"></div>
            <div id="report-output-table" class="data-table"></div>
            <pre id="report-output" class="json-output">{}</pre>
          </div>
        </section>
      </main>
    </div>
    <script src="./auth.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
