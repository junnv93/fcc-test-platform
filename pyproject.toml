# 설치 선언 — fcc-test-platform 레인
#
# 이 파일은 모노레포에서 리뷰되고, 추출 패키저가 납품 상자의 **루트**로 옮겨 싣는다
# (매니페스트 entry `kind: packaging_manifest`, future_path = "pyproject.toml").
#
# ⚠️ 이 파일의 모든 값은 파생이다. 발명한 값이 없다는 것이 봉인 대상이고
#    tests/test_repo_split_packaging_axis.py 가 각 줄의 출처를 대조한다.

[build-system]
# setuptools 62.5.0 릴리스 노트: "The [project] configuration interface in
# pyproject.toml is now fully supported." (공식 history)
requires = ["setuptools>=62.5"]
build-backend = "setuptools.build_meta"

[project]
# name = 매니페스트 `repositories` 의 레인 키.
name = "fcc-test-platform"
# version = 이 레인이 이미 소유한 npm 배포물 apps/web/package.json 과 상등.
#
# ⚠️ **「상등」은 2026-09-05 현재 거짓이고 그것을 재는 검사가 0건이다** — 이 값은
# `0.1.10`, npm 쪽은 `0.1.4` 다. 형제 레인(`fcc-test-contracts`)이 2026-09-04 에
# 자기 자리에서 같은 사실을 이미 적었다. 이번 판올림에서 npm 을 끌어올려 맞추지
# **않았다**: 그러면 둘이 보조를 맞춰 온 것처럼 보이게 되고, 갈라진 사실 자체가
# 사라진다. 위 한 줄은 지금 산문 주장이지 게이트가 아니다. 소유 웨이브 미정.
#
# ⚠️ **0.1.10 은 wire 파손을 담는다** — 소비 레인은 이 번호로 pin 하기 전에 측정
# job 축을 함께 옮겨야 한다. 파손은 `headless-api` 에만 있고 `platform-api` 는
# **표면 변화가 0** 이다(아래 수치는 문서가 아니라 `git diff v0.1.9..v0.1.10` 실측):
#
#     /headless/jobs/{job_id}        → /headless/jobs/{job_uuid}
#     /headless/jobs/{job_id}/stop   → /headless/jobs/{job_uuid}/stop
#
#     MeasurementJobSnapshot         `id` 삭제 · `job_uuid` **required**
#     MeasurementJobSubmitted        `id` 삭제
#     StopMeasurementJobResponse     `job_id` → `job_uuid` (**required**)
#     TestPlanGenerationJobResponse       `job_id` → `generation_job_id` (**required**)
#     TestPlanGenerationMetadataResponse  동상
#     TestPlanGenerationSubmittedResponse 동상
#
# 커밋 c14e653(PR #70, 계약 v0.1.22 추종). ⚠️ **이 상자의 `apps/web` 은 같은
# 커밋에서 함께 옮겨졌다** — 상자는 자기 안에서 정합하고, 갈라지는 것은 백엔드
# 핀만 올리고 웹 이미지를 그대로 두는 **부분 배포**다.
#
# ⚠️ 파손을 «이름 집합»으로 재면 안 보인다 — operationId 40 → 40, 스키마 이름
# 80 → 80, 삭제 0 이다. 바뀐 것은 **경로 템플릿과 속성 키**이므로 v0.1.9 가
# 세운 「오퍼레이션·스키마 수」 형태의 차분만으로는 이 표가 나오지 않는다.
# 경로·파라미터·속성 축을 따로 재라.
#
# ■ 나머지는 순수 추가다
#
#     platform-api  오퍼레이션 79 → 79 · 스키마 132 → 132 (변화 0)
#     import 표면   모듈 175 → 211 · **삭제 0** · 신규 36
#                   (`*_cli` 35 + `keycloak_chamber_admin`)
#
# ■ 이 판이 처음으로 «명령»을 싣는다 — 진입점 0 → 37
#
# `scripts/` 알맹이 38건이 패키지로 들어오고(PR #84·#87·#88) 그 위에 진입점
# 표가 섰다(PR #86). 그래서 소비 레인은 **이 저장소 없이** 도구를 부를 수 있다:
#
#     fcc-platform-db-migrate · fcc-platform-central-db-live-proof · …(37개)
#
# 휠 실측: `fcc_test_platform/*_cli.py` **37** 실림 · `scripts/` **0** 실림 ·
# `entry_points.txt` **37**.
#
# ⚠️ **의존 선언이 또 옮겨졌다.** 두 공유 레인은 `--no-deps` 로 설치되므로 전이
# 의존의 소유자가 **소비 레인**이다:
#
#     fcc-test-contracts   v0.1.21 → v0.1.22   (⚠️ 그 판도 wire 파손을 담는다)
#     fcc-test-kernel      kernel-v0.5.0       (v0.1.9 와 같음 — 새로 적을 것 없음)
#
version = "0.1.10"
description = "Central DB, backend API, auth/RBAC, frontend shell, provider registry, deployment composition, and report/artifact browsing workflows."
# requires-python = infra/central/Dockerfile.api 의 `FROM python:3.11-slim`.
requires-python = ">=3.11"
dependencies = [
    # 형제 레인. 방향은 매니페스트 `depends_on` 에 **이미** 선언돼 있고
    # (fcc-test-platform → fcc-test-contracts) 이 줄은 그 선언을 설치 축으로
    # 옮긴 것이지 넓힌 것이 아니다 — depends_on 은 한 글자도 바뀌지 않았다.
    # 버전 하한을 적지 않는 이유: 두 배포물을 담을 인덱스가 아직 없어
    # 해석기가 비교할 대상이 없다(§lockfile 이연 사유와 같다). 이름의 정합은
    # `depends_on ∩ extraction_target` 파생 상등으로 봉인한다.
    # ⚠️ A DIRECT reference, not a bare name. Measured 2026-08-30: a bare
    # `fcc-test-contracts` made `pip install fcc-test-platform` fail outright --
    # *"No matching distribution found"* -- because no index serves the sibling.
    # A box that cannot install itself is not delivered, whatever its contents.
    # The URL and the tag are DERIVED (manifest `delivery_remote` + the sibling's
    # own declared version); `TestTheSiblingPinTracksTheSiblingVersion` is what
    # keeps this copy from drifting when that version moves.
    "fcc-test-contracts @ git+https://github.com/junnv93/fcc-test-contracts@v0.1.22",
    # 공유 커널 1단계 (ADR-0001, 2026-09-03). 형제 레인과 **같은 저장소의 다른
    # 배포판**이라 `#subdirectory=` 가 붙는다 — 「한 저장소, 여러 배포판」은 그쪽이
    # 이미 npm `@fcc/api-artifacts` 로 하고 있던 패턴이다.
    #
    # ⚠️ 이것이 계약 레인이 **아닌** 이유: `fcc-test-contracts` 는 provider 어휘를
    # 받지 않는다(ADR-0010 D-8). 공유 폐포 53개 중 9개가 코드에 provider 어휘를
    # 지므로 그 레인으로 승격할 수 없고, 그래서 고유 접두사를 갖는 별도 배포판이다.
    #
    # 형제와 같은 이유로 **DIRECT reference** 다 — 이 배포물을 담을 인덱스가 없다.
    # 태그를 못 박는다: 움직이는 ref 는 「어느 코드가 돌았나」를 사후에 답할 수 없게 한다.
    "fcc-test-kernel @ git+https://github.com/junnv93/fcc-test-contracts@kernel-v0.5.0#subdirectory=packages/fcc-test-kernel",
    # 상자의 런타임이 실제로 도달하는 서드파티. 실측 기준은 *도달*이지
    # 모듈 레벨 여부가 아니다 — platform 의 런타임 import 는 합성 경계에서
    # 지연되지만(fastapi 4건 · psycopg 2건이 함수 안) 그 지연은 합성 패턴이지
    # 선택성이 아니다. 이 둘 없이는 두 웹 표면이 뜨지 않는다.
    # 하한은 requirements-central.txt SSOT(중앙 허브 컨테이너 의존성 SSOT,
    # tests/test_central_docker_compose.py 봉인).
    "fastapi>=0.136.1",
    "psycopg[binary]>=3.1",
    # ⚠️ RUNTIME, not a test aid. fcc_test_platform/application/password_hasher.py
    # imports it lazily, so the box installs fine and then dies on the first
    # login. A delivered distribution that cannot perform its own function
    # without an undeclared third party is not delivered. Floor derived from
    # requirements-central.txt, the runtime dependency SSOT.
    "bcrypt>=3.2.0",
]


# ── 운영 도구의 진입점 ──────────────────────────────────────────────
# ⚠️ **이 표는 손으로 유지하지 않는다.** SSOT 는 패키지 자신이다 —
#    `fcc_test_platform/<name>_cli.py` 가 최상위 `main()` 을 가지면 그것이 도구다.
#    이 표는 그 사실의 «투영»이고, 어긋나면
#    `tests/test_tool_entry_points_axis.py` 가 빨갛게 만든다(양방향 — 빠진 것도,
#    남은 것도). PEP 621 은 정적 선언을 요구한다(코드를 실행하지 않고 메타데이터를
#    읽을 수 있어야 하므로) — 그래서 «파생 + 봉인» 이지 «동적 생성» 이 아니다.
#
# ⚠️ **target 은 반드시 `fcc_test_platform.*` 안이어야 한다.** `scripts.*` 로 쓰면
#    editable 설치(로컬·CI·pre-push)에서는 import 되고 **실제 휠에서만 죽는다** —
#    모든 게이트가 초록인데 운영자 기계에서만 `ModuleNotFoundError` 다.
#    그 규칙도 같은 시험이 봉인한다.
#
# 이름 규칙: `fcc-platform-` + 모듈 이름에서 `_cli` 를 떼고 `_`→`-`.
#    도구마다 정할 것이 없다 — 규칙이 이름을 만든다.
[project.scripts]
fcc-platform-artifact-sync-evidence = "fcc_test_platform.artifact_sync_evidence_cli:main"
fcc-platform-artifact-sync-worker = "fcc_test_platform.artifact_sync_worker_cli:main"
fcc-platform-backup-restore-drill = "fcc_test_platform.backup_restore_drill_cli:main"
fcc-platform-backup-restore-runner = "fcc_test_platform.backup_restore_runner_cli:main"
fcc-platform-bench-project-result-selection = "fcc_test_platform.bench_project_result_selection_cli:main"
fcc-platform-central-db-live-proof = "fcc_test_platform.central_db_live_proof_cli:main"
fcc-platform-chamber-measurement-staging-gate = "fcc_test_platform.chamber_measurement_staging_gate_cli:main"
fcc-platform-chamber-token-evidence = "fcc_test_platform.chamber_token_evidence_cli:main"
fcc-platform-check-auth-mode-pairing = "fcc_test_platform.check_auth_mode_pairing_cli:main"
fcc-platform-cross-session-result-selection-evidence = "fcc_test_platform.cross_session_result_selection_evidence_cli:main"
fcc-platform-cutover-bundle = "fcc_test_platform.cutover_bundle_cli:main"
fcc-platform-cutover-completion-audit = "fcc_test_platform.cutover_completion_audit_cli:main"
fcc-platform-cutover-live-workflow = "fcc_test_platform.cutover_live_workflow_cli:main"
fcc-platform-cutover-readiness = "fcc_test_platform.cutover_readiness_cli:main"
fcc-platform-db-migrate = "fcc_test_platform.db_migrate_cli:main"
fcc-platform-db-migration-collect = "fcc_test_platform.db_migration_collect_cli:main"
fcc-platform-db-migration-evidence = "fcc_test_platform.db_migration_evidence_cli:main"
fcc-platform-db-migration-runner = "fcc_test_platform.db_migration_runner_cli:main"
fcc-platform-deployment-evidence-workflow = "fcc_test_platform.deployment_evidence_workflow_cli:main"
fcc-platform-export-central-db-ddl = "fcc_test_platform.export_central_db_ddl_cli:main"
fcc-platform-extraction-evidence = "fcc_test_platform.extraction_evidence_cli:main"
fcc-platform-extraction-runner = "fcc_test_platform.extraction_runner_cli:main"
fcc-platform-frontend-browser-qa = "fcc_test_platform.frontend_browser_qa_cli:main"
fcc-platform-frontend-deployment-collect = "fcc_test_platform.frontend_deployment_collect_cli:main"
fcc-platform-frontend-deployment-evidence = "fcc_test_platform.frontend_deployment_evidence_cli:main"
fcc-platform-frontend-qa-evidence = "fcc_test_platform.frontend_qa_evidence_cli:main"
fcc-platform-identity-policy = "fcc_test_platform.identity_policy_cli:main"
