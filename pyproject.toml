# 설치 선언 — fcc-test-platform 레인
#
# 이 파일은 모노레포에서 리뷰되고, 추출 패키저가 납품 상자의 **루트**로 옮겨 싣는다
# (매니페스트 entry `kind: packaging_manifest`, future_path = "pyproject.toml").
#
# ⚠️ 이 파일의 모든 값은 파생이다. 발명한 값이 없다는 것이 봉인 대상이고
#    tests/test_repo_split_packaging_axis.py 가 각 줄의 출처를 대조한다.

[build-system]
# setuptools 62.5.0 릴리스 노트: "The [project] configuration interface in
# pyproject.toml is now fully supported." (공식 history)
requires = ["setuptools>=62.5"]
build-backend = "setuptools.build_meta"

[project]
# name = 매니페스트 `repositories` 의 레인 키.
name = "fcc-test-platform"
# version = 이 레인이 이미 소유한 npm 배포물 apps/web/package.json 과 상등.
version = "0.1.8"
description = "Central DB, backend API, auth/RBAC, frontend shell, provider registry, deployment composition, and report/artifact browsing workflows."
# requires-python = infra/central/Dockerfile.api 의 `FROM python:3.11-slim`.
requires-python = ">=3.11"
dependencies = [
    # 형제 레인. 방향은 매니페스트 `depends_on` 에 **이미** 선언돼 있고
    # (fcc-test-platform → fcc-test-contracts) 이 줄은 그 선언을 설치 축으로
    # 옮긴 것이지 넓힌 것이 아니다 — depends_on 은 한 글자도 바뀌지 않았다.
    # 버전 하한을 적지 않는 이유: 두 배포물을 담을 인덱스가 아직 없어
    # 해석기가 비교할 대상이 없다(§lockfile 이연 사유와 같다). 이름의 정합은
    # `depends_on ∩ extraction_target` 파생 상등으로 봉인한다.
    # ⚠️ A DIRECT reference, not a bare name. Measured 2026-08-30: a bare
    # `fcc-test-contracts` made `pip install fcc-test-platform` fail outright --
    # *"No matching distribution found"* -- because no index serves the sibling.
    # A box that cannot install itself is not delivered, whatever its contents.
    # The URL and the tag are DERIVED (manifest `delivery_remote` + the sibling's
    # own declared version); `TestTheSiblingPinTracksTheSiblingVersion` is what
    # keeps this copy from drifting when that version moves.
    "fcc-test-contracts @ git+https://github.com/junnv93/fcc-test-contracts@v0.1.21",
    # 공유 커널 1단계 (ADR-0001, 2026-09-03). 형제 레인과 **같은 저장소의 다른
    # 배포판**이라 `#subdirectory=` 가 붙는다 — 「한 저장소, 여러 배포판」은 그쪽이
    # 이미 npm `@fcc/api-artifacts` 로 하고 있던 패턴이다.
    #
    # ⚠️ 이것이 계약 레인이 **아닌** 이유: `fcc-test-contracts` 는 provider 어휘를
    # 받지 않는다(ADR-0010 D-8). 공유 폐포 53개 중 9개가 코드에 provider 어휘를
    # 지므로 그 레인으로 승격할 수 없고, 그래서 고유 접두사를 갖는 별도 배포판이다.
    #
    # 형제와 같은 이유로 **DIRECT reference** 다 — 이 배포물을 담을 인덱스가 없다.
    # 태그를 못 박는다: 움직이는 ref 는 「어느 코드가 돌았나」를 사후에 답할 수 없게 한다.
    "fcc-test-kernel @ git+https://github.com/junnv93/fcc-test-contracts@kernel-v0.5.0#subdirectory=packages/fcc-test-kernel",
    # 상자의 런타임이 실제로 도달하는 서드파티. 실측 기준은 *도달*이지
    # 모듈 레벨 여부가 아니다 — platform 의 런타임 import 는 합성 경계에서
    # 지연되지만(fastapi 4건 · psycopg 2건이 함수 안) 그 지연은 합성 패턴이지
    # 선택성이 아니다. 이 둘 없이는 두 웹 표면이 뜨지 않는다.
    # 하한은 requirements-central.txt SSOT(중앙 허브 컨테이너 의존성 SSOT,
    # tests/test_central_docker_compose.py 봉인).
    "fastapi>=0.136.1",
    "psycopg[binary]>=3.1",
    # ⚠️ RUNTIME, not a test aid. fcc_test_platform/application/password_hasher.py
    # imports it lazily, so the box installs fine and then dies on the first
    # login. A delivered distribution that cannot perform its own function
    # without an undeclared third party is not delivered. Floor derived from
    # requirements-central.txt, the runtime dependency SSOT.
    "bcrypt>=3.2.0",
]

[project.optional-dependencies]
# 상자가 자기 suite 를 싣는다(매니페스트 `lane_test_suite`). 실측: 테스트가
# 모듈 레벨로 도달하는 서드파티는 pytest 와 openpyxl 둘.
# 하한은 각각 requirements.txt:33 · requirements-central.txt SSOT.
# ⚠️ 2026-08-31 — `jsonschema` 와 `PyJWT[crypto]` 는 검사가 **실제로 임포트**
# 하는데 선언에 없었다. 이 머신에는 이미 깔려 있어 로컬은 초록이었고,
# 갓 클론한 CI 러너에서만 드러났다 — 「로컬에서 초록」과 「이 상자가
# 자족적」이 다른 축인 자리다. 실측: `test_apps_web_auth_scaffold` ·
# `test_headless_snapshot_contract_conformance` 가 jsonschema 를,
# `lane_check_plugin` 이 jwt 를 임포트한다.
test = [
    "pytest>=7.0.0",
    "openpyxl>=3.1.0",
    "httpx>=0.28.1",
    "jsonschema>=4.0.0",
    "PyJWT[crypto]>=2.8.0",
    # ⚠️ 2026-09-04 — 같은 결함이 세 번째로 났다. `test_central_docker_compose.py` 가
    # compose 를 파싱하려고 `yaml` 을 부르는데 선언에 없었고, 그 결과 **중앙 저장소의
    # lane-check CI 가 24건 빨간 채로 굳어 있었다**(run 33858657216). 빨간 것이 기본이
    # 되면 새 회귀가 그 소음에 묻힌다 — 직전 배송은 자기 회귀가 0건임을 증명하려고
    # main 의 실패 집합과 손으로 대조해야 했다.
    #
    # ⭐ 이번에는 주석으로 끝내지 않았다. `tests/test_supply_closure_axis.py` 가 이
    # 목록과 실제 import 를 **파생해서 대조**한다. 다음 누락은 사람이 아니라 게이트가
    # 이름을 대고 멈춘다.
    "PyYAML>=6.0",
]
# 브라우저 QA 도구(`scripts/platform_frontend_browser_qa.py`)만 쓰는 것. 중앙 이미지의
# 의존성 집합(`requirements-central.txt`)에는 **의도적으로 없다** — Dockerfile 주석이
# 그 사실을 적는다(desktop/chamber 패키지 제거). 그래도 이 상자가 그 스크립트를 싣는
# 이상 무엇이 필요한지는 선언돼야 한다. 선언하지 않으면 「돌려보니 죽더라」가 유일한
# 발견 경로가 된다.
browser-qa = [
    "selenium>=4.0.0",
]

# ⚠️ selenium(scripts/platform_frontend_browser_qa.py) 과 psycopg2 폴백
#    (scripts/platform_db_migrate.py 외 2)은 **선언하지 않는다**. 둘 다 운영자
#    CLI 안의 함수 레벨 import 이고, requirements-central.txt 는 selenium 을
#    *의도적으로 제외*한다고 스스로 적는다("web automation; device-automation
#    only"). 하한 SSOT 가 없는 이름에 버전을 붙이는 것은 발명이다 — 장부에
#    이름과 사유로 남긴다.

[tool.setuptools.packages.find]
# 상자의 최상위 import 패키지 셋. domain/ 과 application/central_contract/ 는
# shared-kernel 소비 폐포로 실린 트리이고(소유는 shared-kernel, 납품은 이 상자)
# 실제 import 이름이 `domain.*` / `application.central_contract.*` 이므로 배포에
# 포함해야 한다. apps/ · config/ · docs/ · infra/ · migrations/ · web/ 은 파이썬
# 패키지가 아니고, scripts/ 는 상자에 `__init__.py` 가 의도적으로 없다(contracts
# 선언의 같은 사유).
#
# ⚠️ `application*` 이 아니라 `application.central_contract*` 다. 상자에는
# `application/` 아래 이 폐포뿐이지만, 넓은 패턴은 «이 상자가 application 계층을
# 받는다» 라고 선언하는 것이고 그것은 ADR-0018 D-5 가 닫아 둔 방향이다 —
# 다음에 다른 `application/` 하위가 실리면 조용히 딸려 나간다.
# ⚠️ 2026-09-03 — 세 이름이 늘었다. 늘린 이유는 «있으면 좋아서» 가 아니라 **실측**이다:
# 중앙 스택에서 FCC 트리를 없애자 platform-api 의 합성이 이 셋에서 멈췄다.
#   infrastructure*            챔버 프록시 · 기계 신분증 토큰 · 진행률 브로드캐스터 ·
#                              샘플재고 Excel. 전부 **중앙 관심사**이고 provider 것이
#                              아니다 — 추출 때 안 왔을 뿐이다(15파일 2,717줄 이관).
#   application.session*       `chamber_proxy_adapter` 가 `SESSION_API_ROUTES` 를 쓴다.
#                              노드 Session API 의 경로 SSOT 이고, 중앙이 그 hop 을
#                              거는 쪽이므로 소비가 맞다.
# `application*` 로 넓히지 않는 이유는 아래 옛 주석 그대로다 — 넓은 패턴은 «이 상자가
# application 계층을 받는다» 는 선언이고 ADR-0018 D-5 가 닫아 둔 방향이다.
include = ["fcc_test_platform*"]
# ⚠️ **2026-09-03 — `domain*` 과 `infrastructure*` 가 여기서 사라졌다.**
# 커널 3단계가 마지막 두 최상위 이름을 놓았다:
#   공유 24    → `fcc_test_kernel.{domain,infrastructure}.*`
#   중앙 전용 62 → `fcc_test_platform/{domain,infrastructure}/`
#
# **이 상자는 이제 최상위 이름을 하나만 주장한다: `fcc_test_platform`.**
# 챔버 PC 의 `PYTHONPATH=src` 와 겹치던 이름 넷이 전부 정리됐다
# (`logger_config` 1단계 · `application` 2단계 · `domain`·`infrastructure` 3단계).
# 판정: `scripts/check_import_name_ownership.py` — 두 기계 모두 exit 0 이어야 한다.
# ⚠️ **2026-09-03 — `application.central_contract*` 와 `application.session*` 이
# 여기서 사라졌다.** 커널 2단계가 그 최상위 이름을 통째로 놓았다:
#   공유 31파일   → `fcc_test_kernel.application.*` / `fcc_test_kernel.domain.*`
#   중앙 전용 4   → `fcc_test_platform/application/` (위 `fcc_test_platform*` 이 나른다)
# 이 상자는 이제 `application` 이라는 최상위 이름을 **주장하지 않는다** —
# 챔버 PC 의 `PYTHONPATH=src` 와 겹치던 이름 넷 중 셋이 정리됐다
# (`logger_config` 1단계 · `infrastructure` 미주장 · `application` 여기).
# 남은 것은 `domain` 하나다. 판정은 `scripts/check_import_name_ownership.py`.
# 실측: 상자의 fcc_test_platform/ 에 `__init__.py` 가 없다(PEP 420). domain/ 은
# 있다. 두 모양이 한 배포에 섞이므로 명시한다.
namespaces = true

[tool.setuptools]
# ⚠️ **최상위 모듈은 `packages.find` 가 못 찾는다** — 패키지가 아니기 때문이다.
# `logger_config` 는 `infrastructure/excel/atomic_write.py` 와
# `chamber_progress_broadcaster.py` 가 모듈 레벨에서 부른다. 빠지면 휠은 만들어지고
# 설치도 되는데 **import 하는 순간 죽는다** — 바로 아래 package-data 주석이 적는
# `decision_catalogue.json` 과 같은 계급의 결함이다.
# ⚠️ **비었다 — 그리고 그것이 이 웨이브의 결과다** (ADR-0001 1단계, 2026-09-03).
# 여기 있던 `logger_config` 가 두 레인이 동시에 주장하던 최상위 이름 넷 중 하나였다.
# 이제 그 모듈은 `fcc_test_kernel.logger_config` 이고, 이 배포판은 그 이름을
# **선언하지 않는다** — `scripts/check_import_name_ownership.py` 가 그것을 본다.
#
# 목록을 지우지 않고 빈 채로 두는 이유: 다음 사람이 최상위 모듈을 담고 싶을 때
# 이 자리와 그 사유를 먼저 읽게 하려는 것이다. 최상위 이름은 **다투는 자원**이다.
py-modules = []

[tool.setuptools.package-data]
# ⚠️ **패키지 데이터는 import 가 아니다** — 이 저장소가 이미 한 번 값을 치른 계급이다.
# `domain/models/reference_catalog.py` 는 **모듈 레벨**에서 `decision_catalogue.json` 을
# 읽으므로, 그것이 빠진 배포물은 설치도 되고 휠도 만들어지지만 **import 하는 순간 죽는다**
# (실측: `ReferenceCatalogError: decision catalogue resource is unavailable`).
# 같은 파일이 shared-kernel 소비 폐포 웨이브에서 **13건을 죽였고**, 그때의 교훈이
# *"폐포는 모듈이 착지한 디렉터리의 governed 비-.py 를 함께 싣는다"* 였다. 상자에는
# 실려 있고 **휠에만 없었다** — 스테이징을 재는 축은 그것을 볼 수 없다.
# 실측 대상 집합은 오늘 이 한 파일뿐이므로 있는 것만 선언하고, *전량성*은
# `tests/test_repo_split_packaging_axis.py` 가 **실제로 휠을 빌드해서** 단언한다
# (새 확장자가 생기는 날 그 봉인이 red 로 이름을 댄다 — 선언을 넓게 적어두는 쪽은
# 아무것도 검사하지 않으면서 검사한 것처럼 읽힌다).
"*" = ["*.json"]
# PM/RF 엑셀 내보내기 템플릿 (2026-09-04). 2026-09-04 이전에는 이 둘이
# `tests/fixtures/` 에 있었고 렌더러가 `parents[3]` 로 걸어 나가 읽었다 — 개발
# 트리에서만 성립하는 형태다. 이미지는 `tests/` 를 COPY 하지도 않고 휠은
# `fcc_test_platform*` 만 실으므로 컨테이너에서 내보내기는 **구조적으로** 불가능했다.
# 위 `*.json` 과 정확히 같은 계급의 결함이고, 같은 답을 준다: 코드가 읽는 비-.py 는
# 코드와 함께 실린다.
#
# ⚠️ 봉인은 `tests/test_sample_inventory_exporter.py` 다 — 자원이 패키지 경계 **안에서**
# 해소되는지와 이 선언이 파일 집합을 덮는지를 본다. 바로 위 `*.json` 주석이 참조하는
# `tests/test_repo_split_packaging_axis.py` 는 **이 상자에 없다**(모노레포 잔여, 실측
# 2026-09-04). 즉 「실제로 휠을 빌드해 전량성을 재는」 축은 이 레인에 아직 없고,
# 그 자리는 지금 사람이 손으로 메운다: 2026-09-04 에 휠을 빌드해 두 xlsx 가 실린 것과,
# 소스 트리 없이 설치된 휠만으로 PM/RF 내보내기가 도는 것을 확인했다.
"fcc_test_platform.infrastructure.excel" = ["templates/*.xlsx"]

# ⚠️ 사본이다 — TOML 에는 include 가 없다. 그래서 루트 pyproject.toml 의
#    testpaths/markers/addopts 와 **상등 파리티 게이트**를 함께 세운다
#    (tests/test_repo_split_packaging_axis.py). 이 저장소의 표준 답:
#    강제된 사본에는 파리티 게이트를 단다.
#
#    세 키를 부분집합으로 옮기지 않는 이유: 이 축이 묻는 것은 "상자를 받은 팀이
#    **우리와 같은** 게이트를 돌 수 있는가"이고, 다른 pytest 설정으로 도는 상자는
#    우리 게이트를 도는 것이 아니다. addopts 의 `-p no:faulthandler` 가 provider
#    쪽 사유(Windows/Python 3.13 OOXML)에서 왔더라도 같이 간다.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: 순수 단위 테스트 (하드웨어/네트워크/실제 파일 불필요)",
    "integration: 통합 테스트 (tempfile, 실제 Excel I/O 사용)",
    "hardware: 하드웨어 필수 (스펙트럼 분석기, Appium, Android)",
    "database: DB 통합 테스트 (SQLite, 실제 파일 I/O)",
    "bench: 정량 latency budget 측정 (GC-sensitive, 권장 단독 실행 — pytest -m bench)",
    "gui: 실제 QApplication/위젯을 만들고 Qt 이벤트 루프를 펌프하는 PySide6 테스트 (전체 회귀의 누적 네이티브 압박 하에서 access violation 크래시 → 단독 실행 -m gui)",
    "invariant: architecture/hygiene/SSOT/contract-drift 가드 (dataclass/AST/파일시스템/frontmatter 검사 — 장비 불필요). ubuntu CI 경량 게이트 대상 (conftest _INVARIANT_FILENAME_TOKENS SSOT 자동 부착).",
]
# Disable pytest's faulthandler plugin on Windows/Python 3.13 because it emits
# handled first-chance "Windows fatal exception: access violation" diagnostics
# during Office Open XML ZIP/XML tests even when the process exits successfully.
# Real failures still surface through non-zero exits and assertions.
addopts = "--strict-markers -p no:faulthandler"
