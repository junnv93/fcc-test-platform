<!doctype html>
<!--
  `lang` MUST equal `DEFAULT_LOCALE` in src/i18n/index.ts — this is the document
  language for the window before /lang-init.js runs (and for a JS-disabled
  client). The stored per-operator choice is applied pre-paint by that script and
  kept in sync at runtime by the i18n layer. Sealed by
  tests/test_frontend_architecture_conformance.py::TestDocumentLangFollowsLocale.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      Security headers — DEFENCE IN DEPTH.
      Production: nginx / CDN MUST set these as actual HTTP headers.
      The meta-tag form below is a fallback so a missing nginx config does not
      ship an unprotected app to staging. Sprint S8 will deliver server-side headers
      via deployment evidence schema.
    -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <title>FCC Test Platform</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Runtime config injection point. nginx / CDN serves
      /runtime-config.js with environment-specific values (see
      docs/architecture/frontend/adr/0001 for repo placement,
      docs/platform/frontend_deployment_evidence.schema.v1.json for layout).
      Loaded BEFORE the app bundle so window.__FCC_RUNTIME_CONFIG__ is
      available at boot. Generated by `npm run dev` or by deploy pipeline
      from runtime-config.template.json + secret-redacted env values.
    -->
    <script src="/runtime-config.js"></script>
    <!--
      Pre-paint theme application (tester-ux redesign Phase T). Sets
      <html data-theme="light|dark"> from the stored choice / OS preference
      BEFORE the app bundle so chamber-room (dark) operators see no
      light-then-dark flash. External file because CSP is `script-src 'self'`.
      Storage key is sealed against src/theme/index.ts THEME_STORAGE_KEY.
    -->
    <script src="/theme-init.js"></script>
    <!--
      Density FOUC guard — applies the stored `data-density` preference before
      the app bundle paints so a compact-density user never sees a
      comfortable→compact row reflow (CLS). External `self`-origin script (NOT
      inline) to satisfy the CSP `script-src 'self'` above. Key SSOT:
      src/shared/density.ts (sealed by tests/density-boot-ssot.test.ts).
    -->
    <script src="/density-boot.js"></script>
    <!--
      Document-language declaration — applies the stored locale to <html lang>
      before the app bundle so a screen reader picks the right speech engine from
      the first paint (the static attribute above can only carry the default).
      External `self`-origin script (NOT inline) to satisfy the CSP above. Key /
      token SSOT: src/i18n/index.ts (sealed by tests/lang-boot-ssot.test.ts +
      TestDocumentLangFollowsLocale).
    -->
    <script src="/lang-init.js"></script>
  </head>
  <body>
    <noscript>
      <p>This application requires JavaScript to be enabled.</p>
    </noscript>
    <!-- Landmarks are owned by routes/_layout.tsx. A role="application"
         wrapper would suppress normal document navigation and nest the
         banner/main/complementary landmarks under a competing landmark. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
