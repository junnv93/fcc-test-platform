# FCC Test Platform — local OIDC IdP (Keycloak) for Sprint S2.
#
# Usage:
#   cd <repo root>
#   docker compose -f infra/docker-compose.idp.yml up -d
#   open http://localhost:8081/  (admin / admin)
#
# Realm import:
#   On first boot Keycloak imports `infra/keycloak/fcc-dev-realm.json`,
#   which provisions:
#     * realm                : fcc-dev
#     * public PKCE client   : fcc-platform-frontend  (no client secret)
#     * roles                : viewer / operator / admin
#     * test users           : viewer/viewer / operator/operator / admin/admin
#     * permissions claim    : groups-style mapper emitting `permissions` claim
#
# This file is dev-only: do NOT use these images / settings in production.
# Production IdP integration (Azure AD / Okta / Auth0) happens via the
# runtime-config.json deployment artefact — frontend code is identical.

services:
  keycloak:
    # Pinned to Keycloak 25 (April 2024 LTS line — supports OIDC PKCE S256
    # by default and ships the modern Quarkus distribution). Bump alongside
    # ADR-0002 stack revisits.
    image: quay.io/keycloak/keycloak:25.0
    container_name: fcc-keycloak-dev
    # 데몬 blip/재부팅 시 자동 부활 (defense-in-depth). dev-only 파일이라
    # production 무관. 예전 readiness 타임아웃 자가파괴와 무관한 인프라 견고화.
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Allow the frontend dev server (Vite on 5173) to reach the IdP.
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

# Networks intentionally omitted — Keycloak only needs to expose 8081 on
# the host so the Vite dev server (also on host) can reach it. Add an
# explicit network here when Sprint S3 introduces the platform backend
# compose stack.
