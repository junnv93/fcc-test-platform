# FCC Central Hub — SPA static + same-origin API gateway (B1/P13).
#
# This nginx is BOTH the SPA static server AND the browser's same-origin API
# gateway. The browser talks to exactly one origin (this container, :8080):
#   * /              -> SPA static (history-mode fallback)
#   * /headless/*    -> reverse-proxy to the headless-api ASGI app  (:8001)
#   * /report-automation/* -> same headless-api app (:8001)
#   * /health        -> same headless-api app (:8001), exact match
#   * /platform/*    -> reverse-proxy to the platform-api ASGI app  (:8002)
#   * /runtime-config.js -> never cached (per-environment endpoints)
#   * hashed assets  -> long-lived immutable cache
#
# Because every API/WS call is same-origin, the FastAPI surfaces need NO CORS
# middleware (they carry none). This mirrors the dev topology — apps/web's vite
# server.proxy + dev-stack.config.json path-route the same prefixes to the same
# ASGI factories. The Authorization: Bearer <OIDC JWT> header is forwarded
# verbatim and validated by the backend's OIDC resolver.
#
# --- Backend prefix coverage, and the ONE deliberate exclusion ---------------
# The gateway must route every top-level prefix the backend surfaces expose.
# That set is DERIVED from the route tables (src/application/*/api_contract*.py)
# by tests/test_central_docker_compose.py::TestCentralGatewayCoversEveryBackendPrefix
# — never hand-listed, because a prefix nobody typed is a prefix nobody checks.
# That is exactly how /report-automation went unproxied here for as long as it
# existed (gate-and-deploy-path-parity, 2026-08-01): the report-request CANCEL
# button and the queue-stats panel were shipped, reached this gateway, fell
# through to the SPA index.html, and got HTML back instead of JSON.
#
# An excluded prefix must be declared on a `fcc-proxy-exclude:` line below, in
# a closed reason vocabulary, and each reason carries a machine-checked witness
# — an exclusion without a witness would just be a mute button for the seal.
#
# fcc-proxy-exclude: /session reason=runtime-flag-disabled
#
# /session/* (live measurement control + the /session/events WebSocket) is NOT
# served here: measurement sessions run on native chamber nodes (GPIB/USB/
# Nuitka-exe), not in this win32-free container stack, and there is no single
# session API to proxy (measurement is distributed across many chamber nodes via
# the Platform chamber API). This is NOT a silent gap: the SPA's runtime-config
# sets `sessionApiEnabled: false` (runtime-config.central.js.template), so the
# browser never issues a /session/* call that would fall through to the SPA
# index.html and break. The "not served here" ⟺ "disabled in runtime-config"
# coherence is sealed by
# tests/test_central_docker_compose.py::TestCentralSessionSurfaceBoundary — a
# future /session location here without flipping the flag (or vice versa) fails.
#
# /health is NOT excluded, deliberately. It has no browser caller today, but the
# dev gateway proxies all five prefixes and refused an allowlist on the grounds
# that the allowlist itself is how the next session quietly reopens the hole
# (apps/web/dev-stack.config.json). Excluding it would also be incoherent with
# this very gateway already exposing /platform/health and /platform/ready
# unauthenticated through the /platform/ location. One exclusion, strongly
# witnessed, beats two.

# --- Gateway-layer rate limiting (defense in depth, 2026-07-19) -------------
# The ASGI surfaces carry their own per-principal throttle
# (src/domain/services/rate_limit_policy.py). This layer is deliberately NOT a
# duplicate of it: nginx sees the REAL peer address (the app sees whatever the
# proxy forwards) and sheds a flood *before* it costs a Python worker, a DB
# connection, or a JWT verification. The app layer, in turn, is the only one
# that can tell two authenticated principals behind one NAT apart. Two layers,
# two different blind spots.
#
# Zones are sized generously relative to the app budgets — nginx is the blunt
# instrument (crude DoS shedding), the app is the precise one (per-principal
# fairness). A legitimate operator must never meet this limit first; if they do,
# the app's 429 with Retry-After is the better response, which is why the burst
# is large and `nodelay` keeps interactive latency intact.
#
# One zone, not one per path class: nginx here is the crude layer, and the
# precise per-path budget (notably the tighter allowance for the auth-exempt
# /metrics scrape endpoints) is the app layer's job — duplicating that split
# here would mean maintaining the same policy twice, in two languages, with the
# gateway copy silently drifting. 10m of shared memory tracks ~160k distinct
# addresses, far beyond any lab.
limit_req_zone $binary_remote_addr zone=fcc_api:10m rate=20r/s;

# 429 (not the nginx default 503): a rate-limited request is a client-rate
# problem, and it matches the status the ASGI surfaces return, so a client sees
# one consistent signal regardless of which layer shed the request.
limit_req_status 429;

# Docker's embedded DNS — resolve upstream service names at request time so a
# brief API restart does not prevent nginx from starting.
resolver 127.0.0.11 valid=30s ipv6=off;

# WebSocket upgrade switch — only a request that carries an `Upgrade` header (a
# real WS handshake) gets `Connection: upgrade`; ordinary REST requests get
# `Connection: close`. Lets the same same-origin gateway carry both HTTP and the
# Platform chamber-events WebSocket without affecting plain HTTP traffic.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Same-origin API gateway (path-routed, no CORS needed) ---------------
    location /headless/ {
        # Burst absorbs a page-load fan-out (the SPA issues a handful of
        # parallel queries per route); `nodelay` serves the burst immediately
        # instead of queueing it, so normal use never feels the limiter.
        limit_req zone=fcc_api burst=40 nodelay;
        set $headless_upstream http://headless-api:8001;
        proxy_pass $headless_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /report-automation/ {
        # Same upstream as /headless/ — one ASGI app mounts both prefixes. It
        # needs its own location block regardless: nginx routes on the URI
        # prefix, so /headless/ can never match /report-automation/*.
        limit_req zone=fcc_api burst=40 nodelay;
        set $report_automation_upstream http://headless-api:8001;
        proxy_pass $report_automation_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # EXACT match, not the `location /health/ {` shape used above. The headless
    # surface exposes exactly one route here — bare `/health`, with no children
    # — and an nginx prefix location written with a trailing slash only matches
    # URIs that *start* with `/health/`. `GET /health` would miss it, fall
    # through to the SPA fallback and return 200 + index.html: the same
    # "config declares it, behaviour denies it" failure this block exists to
    # fix. Sealed by TestCentralGatewayCoversEveryBackendPrefix, which derives
    # the required match form from the route table's path shape.
    location = /health {
        limit_req zone=fcc_api burst=40 nodelay;
        set $health_upstream http://headless-api:8001;
        proxy_pass $health_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /platform/ {
        # Burst absorbs a page-load fan-out (the SPA issues a handful of
        # parallel queries per route); `nodelay` serves the burst immediately
        # instead of queueing it, so normal use never feels the limiter.
        limit_req zone=fcc_api burst=40 nodelay;
        set $platform_upstream http://platform-api:8002;
        proxy_pass $platform_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Per-environment runtime config must always be re-fetched.
    location = /runtime-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Content-hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell contains content-hashed asset references and must be
    # revalidated so a deployment cannot strand clients on an old graph.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
