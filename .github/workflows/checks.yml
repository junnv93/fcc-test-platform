# 이 레인의 검사 게이트.
#
# ⚠️ 2026-08-30 실측: 이 계정의 GitHub Actions 는 **러너를 배정받지 못한다.**
#    잡이 2초 만에 `steps: []` · `runner_name: ""` 로 실패한다 — 즉 실패가 아니라
#    시작조차 못 하는 것이다. 두 상태는 다운스트림에서 똑같이 빨간 X 로 보인다.
#    근거: 본문이 `echo` 한 줄뿐인 프로브 워크플로도 같은 지문으로 실패했다
#    (fcc-test-contracts run 33308109800). 코드가 없으니 코드를 탓할 수 없다.
#
#    그래서 이 파일은 오늘 **휴면**이다. 지우지 마라 — 결제/가시성이 풀리는 순간
#    그날로 발화하고, 그때 다시 만들지 않아도 된다. 오늘 실제로 막는 것은
#    같은 명령을 부르는 `githooks/pre-push` 다.
#
#    ⚠️ 러너가 돌아와도 **private 인 동안에는 분당 과금**이다. 이 계정은 8월에
#    포함분(3,000분)의 2.5배인 7,407분을 썼고 그것이 차단의 원인이다. 이 레포가
#    public 이면 표준 러너는 **무과금·무제한**이다.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR 반복만 취소한다. main 런을 취소하면 그 커밋에 검증 기록이 남지 않는다.
  #
  # ⚠️ 2026-09-06 실측 — 위 문장은 «의도»였고 설정은 그것을 달성하지 못했다.
  #    한 세션이 PR 다섯을 5~7초 간격으로 머지하자 main 커밋 넷이 `cancelled` 로
  #    끝났다: `8c33bc3` · `4ba0585` · `7827b50` · `64abb7b`. 즉 그 넷에는
  #    **검증 기록이 없다** — 그리고 다운스트림에서 「돌지 않았다」와 「통과했다」는
  #    둘 다 빨간 X 가 아니라서 구별되지 않는다.
  #
  #    원인은 `cancel-in-progress: false` 가 **대기 중인 런을 지키지 않는다**는 데
  #    있다. 그 값은 「이미 «달리는» 런을 취소하지 마라」만 말한다. 한 그룹에서
  #    대기할 수 있는 런은 하나뿐이고, 새 런이 그룹에 들어오면 대기하던 것이
  #    취소된다. 그래서 연속 머지 N 회는 첫 런과 마지막 런만 남긴다.
  #
  #    ⚠️ **머지 둘까지는 증상이 없다** — 대기 자리를 다투는 셋째가 없기 때문이다.
  #    같은 날 10초 간격의 머지 쌍(`4189dca`·`28b2bc4`)은 둘 다 `success` 다.
  #    그래서 이 결함은 「빠르게 머지하면 깨진다」가 아니라 **「셋 이상을 연달아
  #    머지하면 가운데가 사라진다」**이고, 평소의 한두 개짜리 머지로는 관측되지
  #    않는다. 이 설정은 이 레인의 첫 커밋(`45746ed`, 2026-08-30 추출 배송)부터
  #    있었다 — 그 이전 모노레포에서의 이력은 이 레인이 답하지 못한다.
  #
  # ✅ push 는 **커밋마다 그룹을 달리한다.** 그러면 다툴 그룹이 없어 취소가
  #    구조적으로 불가능해지고, 모든 main 커밋이 자기 기록을 갖는다.
  #    PR 은 그대로 ref 별로 묶여 옛 반복이 취소된다 — 그 축은 바꾸지 않았다.
  #
  #    이 형태는 `tests/test_ci_leaves_a_record_for_every_pushed_commit.py` 가
  #    지킨다. 산문으로만 적으면 다음 사람이 「단순화」하며 되돌린다 —
  #    실제로 이 레포에 같은 의도문이 **두 워크플로에 각각** 적혀 있었고
  #    둘 다 그 의도를 달성하지 못했다.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lane-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠️ 기본 checkout 은 **얕은 클론이라 태그를 받아 오지 않는다.**
          # `tests/test_every_release_tag_declares_its_own_version.py` 가 발행된 태그의
          # 트리를 읽어 그 태그의 판번호를 말하는지 본다(2026-09-06 에 v0.1.10 이 판올림
          # 커밋 없이 붙었다). 태그가 없으면 그 검사는 「태그 0개」를 대조하며 **영원히
          # 초록**이다 — 검사가 있다는 사실이 지켜진다는 뜻이 되지 않는다.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # A 세션이 2026-08-30 에 실측한 인터프리터와 같게 둔다.
          python-version: '3.12'
          cache: pip

      - name: 상자를 상자로서 설치한다
        # ⚠️ `-e` 가 아니다. editable 설치는 소스 트리를 sys.path 에 얹어
        #    「상자가 자족적인가」라는 질문에 답하지 못하게 만든다.
        #
        # ✅ 2026-08-31 — **그날이 왔고, 예언보다 나았다.** 옛 문단은 이 스텝이
        #    "오늘 실패한다"고 적으며 러너가 돌아온 날을 대비해 두었는데,
        #    실제로 돌려 보니 **설치가 성공했다**(`Building wheel for
        #    fcc-test-platform … Successfully built`). 레포가 public 이 되면서
        #    형제 레인을 git URL 로 받을 수 있게 됐기 때문이다.
        #    ⚠️ 그러므로 「인덱스가 없어서 못 받는다」는 진단은 **더 이상 참이
        #    아니다** — 그 문장을 남겨 두면 다음 사람이 없는 벽을 피해 간다.
        run: |
          pip install -e '.[test]'  # editable — 비-editable 은 build/ 를 남겨 실패 집합을 오염시킨다

      # ⚠️ non-editable 설치는 `build/` 를 남기고 `lane_check` 는 그것을 거부한다
      #    (그 트리가 소스와 사본 둘을 갖게 되어 「무엇을 쟀나」가 모호해진다).
      #    ⚠️ `.gitignore` 가 덮으므로 `git status` 로는 보이지 않는다 —
      #    「깨끗하다」와 「안 보인다」가 같은 값인 자리다.
      - name: 설치가 남긴 build/ 를 치운다
        run: rm -rf build

      - name: 선언된 실패 집합과 대조한다
        # 검사 정의는 이 파일에 없다 — scripts/lane_check.py 가 SSOT 이고
        # pre-push 훅도 **같은 것**을 부른다. 여기에 pytest 명령을 인라인하면
        # 그 순간 두 게이트가 갈라진다.
        run: python scripts/lane_check.py
