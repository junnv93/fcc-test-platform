# FE-P7 (2026-05-26) — frontend QA + deployment evidence gate.
# Validates committed browser-QA / deployment evidence manifests against their
# schemas (scripts/platform_frontend_{qa,deployment}_evidence.py), and publishes
# canonical templates as artifacts so a QA/deploy run can fill them. Real
# evidence is produced from actual production QA + deploy runs — this gate fails
# the build if any committed manifest drifts from its schema.
name: frontend-qa-evidence

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'scripts/platform_frontend_qa_evidence.py'
      - 'scripts/platform_frontend_deployment_evidence.py'
      - 'docs/evidence/frontend/**'
      - '.github/workflows/frontend-qa-evidence.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'scripts/platform_frontend_qa_evidence.py'
      - 'scripts/platform_frontend_deployment_evidence.py'
      - 'docs/evidence/frontend/**'
      - '.github/workflows/frontend-qa-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # ci-minutes-root-cause (2026-08-07): supersede pull-request iterations,
  # never abandon a main/scheduled run half-verified — a cancelled
  # post-merge run leaves that commit with no verification record.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: install validator deps
        run: python -m pip install jsonschema
      - name: emit canonical evidence templates
        run: |
          python scripts/platform_frontend_qa_evidence.py template > qa-evidence.template.json
          python scripts/platform_frontend_deployment_evidence.py template > deploy-evidence.template.json
      - name: validate committed QA evidence (if any)
        run: |
          shopt -s nullglob
          for f in docs/evidence/frontend/qa-*.json; do
            echo "validating $f"
            python scripts/platform_frontend_qa_evidence.py validate "$f"
          done
      - name: validate committed deployment evidence (if any)
        run: |
          shopt -s nullglob
          for f in docs/evidence/frontend/deploy-*.json; do
            echo "validating $f"
            python scripts/platform_frontend_deployment_evidence.py validate "$f"
          done
      - name: upload evidence templates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence-templates
          path: |
            qa-evidence.template.json
            deploy-evidence.template.json
          if-no-files-found: warn
