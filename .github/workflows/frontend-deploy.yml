# FE-P7 (2026-05-26) — frontend deploy gate (manual dispatch).
# Builds the production bundle and publishes it as a deployable artifact behind
# a protected GitHub Environment. The concrete deploy TARGET (object store /
# CDN / static host) is environment-configured — this workflow intentionally
# does NOT fabricate deploy credentials or URLs; wire the target via the
# `frontend-production` environment secrets when the host is provisioned.
name: frontend-deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build + deploy'
        required: true
        default: 'main'

permissions:
  contents: read

concurrency:
  # ci-minutes-root-cause (2026-08-07): supersede pull-request iterations,
  # never abandon a main/scheduled run half-verified — a cancelled
  # post-merge run leaves that commit with no verification record.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/web

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: frontend-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: gate before deploy (codegen/typecheck/lint/test/build/budget)
        run: |
          npm run codegen
          npm run codegen:check
          npm run typecheck
          npm run lint
          npm test
          npm run build
          node scripts/measure-bundle.mjs
          node scripts/check-bundle-budget.mjs
      - name: publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/web/dist
          if-no-files-found: error
      # Deploy step intentionally omitted until the production host + its
      # `frontend-production` environment secrets are provisioned (no fabricated
      # target). The gated, published `frontend-dist` artifact is the handoff.
